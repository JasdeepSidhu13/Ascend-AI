name: Pulse email

on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping pulse cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_ORIGIN: ${{ secrets.APP_ORIGIN }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_ORIGIN" ]; then
            echo "CRON_SECRET or APP_ORIGIN is not set; skip"
            exit 0
          fi
          case "$APP_ORIGIN" in
            https://*) ;;
            *) echo "APP_ORIGIN must be https; skip"; exit 0 ;;
          esac
          origin="${APP_ORIGIN%/}"
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$origin/api/cron/pulse"
